<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Client ver.3 navrose stitching point </title><meta name="title" content="Client ver.3 navrose stitching point "><meta name="description" content="Voice msg"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal - Navrose Stitching Point</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.75rem;
            white-space: nowrap;
            display: inline-block;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .status-completed { background-color: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .status-pending { background-color: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
        .order-type-stitching { border-left: 5px solid #38bdf8; }
        .order-type-alteration { border-left: 5px solid #facc15; }

        #notification-badge {
            transform: scale(0.8) translate(50%, -50%);
        }
    </style>



    <!-- Login View -->
    <div id="login-view" class="w-full max-w-sm">
        <div class="bg-white p-8 rounded-2xl shadow-xl text-center">
            <div class="w-16 h-16 bg-indigo-100 rounded-full mx-auto flex items-center justify-center mb-4">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Navrose Stitching Point</h1>
            <p class="text-gray-500 mb-8">Customer Order Portal</p>
            <form id="login-form">
                <div class="mb-4">
                    <label for="mobile-input" class="sr-only">Mobile Number</label>
                    <input type="tel" id="mobile-input" class="w-full px-4 py-3 border border-gray-300 rounded-lg text-center text-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all" placeholder="Enter mobile number" required="" pattern="[0-9]{10}">
                </div>
                <button type="submit" id="check-status-btn" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-300 transition-all flex items-center justify-center shadow-md hover:shadow-lg">
                    <span id="btn-text">Check Status</span>
                    <svg id="loading-spinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Details View -->
    <div id="details-view" class="w-full max-w-2xl hidden">
        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl">
            <header class="flex flex-col sm:flex-row justify-between sm:items-center mb-6 pb-4 border-b border-gray-200">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">Welcome, <span id="customer-name"></span>!</h2>
                    <p class="text-gray-500 text-sm">Here are your most recent orders.</p>
                </div>
                <div class="flex items-center gap-4 mt-3 sm:mt-0">
                    <div class="relative">
                        <button id="notification-bell" class="p-2 rounded-full hover:bg-gray-100 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-gray-600"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"></path></svg>
                            <span id="notification-badge" class="absolute top-0 right-0 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden"></span>
                        </button>
                        <div id="notification-dropdown" class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-xl p-2 hidden z-10 border max-h-96 overflow-y-auto">
                            <!-- Notifications will be injected here -->
                        </div>
                    </div>
                     <button id="logout-btn" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">Logout</button>
                </div>
            </header>

            <main>
                <div id="orders-container" class="space-y-6">
                    <!-- Orders will be injected here -->
                </div>
            </main>
        </div>
    </div>
    
    <audio id="notification-sound" src="https://freesound.org/data/previews/270/270319_5123851-lq.mp3" preload="auto"></audio>


    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0_DQIiyaVQllFH4pxH1Dm3r2kFXXoOgc",
            authDomain: "navrosetailorapp.firebaseapp.com",
            databaseURL: "https://navrosetailorapp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "navrosetailorapp",
            storageBucket: "navrosetailorapp.firebasestorage.app",
            messagingSenderId: "574369461681",
            appId: "1:574369461681:web:dbe9d417706ab0b5643990"
        };

        // DOM Elements
        const loginView = document.getElementById('login-view');
        const detailsView = document.getElementById('details-view');
        const loginForm = document.getElementById('login-form');
        const mobileInput = document.getElementById('mobile-input');
        const checkStatusBtn = document.getElementById('check-status-btn');
        const btnText = document.getElementById('btn-text');
        const loadingSpinner = document.getElementById('loading-spinner');
        const customerNameEl = document.getElementById('customer-name');
        const ordersContainer = document.getElementById('orders-container');
        const logoutBtn = document.getElementById('logout-btn');
        const notificationBell = document.getElementById('notification-bell');
        const notificationDropdown = document.getElementById('notification-dropdown');
        const notificationBadge = document.getElementById('notification-badge');
        const notificationSound = document.getElementById('notification-sound');

        let db;
        let ordersRef, notificationsRef; // Firebase listeners

        function initializeFirebase() {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();
            } catch (e) {
                console.error("Firebase initialization failed:", e);
                alert("Could not connect to the service. Please try again later.");
            }
        }
        
        function setLoading(isLoading) {
            if (isLoading) {
                checkStatusBtn.disabled = true;
                btnText.classList.add('hidden');
                loadingSpinner.classList.remove('hidden');
            } else {
                checkStatusBtn.disabled = false;
                btnText.classList.remove('hidden');
                loadingSpinner.classList.add('hidden');
            }
        }

        async function loginAndFetchData(mobile) {
            if (!db) return;
            setLoading(true);
            
            try {
                // Fetch initial data once
                const ordersSnapshot = await db.ref('orders').orderByChild('customerMobile').equalTo(mobile).once('value');
                const notificationsSnapshot = await db.ref(`clientNotifications/${mobile}`).orderByChild('timestamp').limitToLast(10).once('value');
                
                const ordersData = ordersSnapshot.val();
                let allOrders = ordersData ? Object.values(ordersData) : [];
                
                if (allOrders.length === 0) {
                    ordersContainer.innerHTML = `<div class="bg-gray-50 p-6 rounded-lg text-center text-gray-500">No orders found for this mobile number.</div>`;
                    customerNameEl.textContent = 'Guest';
                } else {
                    customerNameEl.textContent = allOrders[0].customerName;
                    
                    let totalBalance = 0;
                    allOrders.forEach(order => {
                        const totalCharges = order.type === 'stitching' 
                            ? (order.items || []).reduce((sum, item) => sum + (parseFloat(item.charges) || 0), 0)
                            : (parseFloat(order.charges) || 0);
                        const received = order.receivedPayment || 0;
                        const balance = Math.max(0, totalCharges - received);
                        totalBalance += balance;
                    });
                    playTotalBalanceNotification(totalBalance);
                }
                
                renderOrders(allOrders);
                
                const notificationsData = notificationsSnapshot.val();
                const notifications = notificationsData ? Object.values(notificationsData).sort((a, b) => b.timestamp - a.timestamp) : [];
                renderNotifications(notifications);
                
                showDetailsView();
                // After initial load, set up real-time listeners
                setupRealtimeListeners(mobile);

            } catch (error) {
                console.error("Error fetching data:", error);
                alert("An error occurred while fetching your data. Please check your mobile number and try again.");
            } finally {
                setLoading(false);
            }
        }

        function setupRealtimeListeners(mobile) {
            // Detach previous listeners if any
            if (ordersRef) ordersRef.off();
            if (notificationsRef) notificationsRef.off();

            // Listen for changes to this customer's orders
            ordersRef = db.ref('orders').orderByChild('customerMobile').equalTo(mobile);
            ordersRef.on('value', (snapshot) => {
                const ordersData = snapshot.val();
                const allOrders = ordersData ? Object.values(ordersData) : [];
                renderOrders(allOrders);
            });

            // Listen for new notifications for this customer
            notificationsRef = db.ref(`clientNotifications/${mobile}`).orderByChild('timestamp').limitToLast(10);
            notificationsRef.on('value', (snapshot) => {
                const notificationsData = snapshot.val();
                const notifications = notificationsData ? Object.values(notificationsData).sort((a,b) => b.timestamp - a.timestamp) : [];
                
                // Check for new, unread notifications to play sound
                const hasUnread = notifications.some(n => !n.read);
                const currentUnreadCount = parseInt(notificationBadge.textContent) || 0;
                const newUnreadCount = notifications.filter(n => !n.read).length;

                if (newUnreadCount > currentUnreadCount) {
                     notificationSound.play().catch(e => console.log("Audio playback failed:", e));
                }

                renderNotifications(notifications);
            });
        }


        function renderOrders(orders) {
            if (!orders || orders.length === 0) {
                 ordersContainer.innerHTML = `<div class="bg-gray-50 p-6 rounded-lg text-center text-gray-500">No orders found for this mobile number.</div>`;
                 return;
            }
            
            orders.sort((a, b) => new Date(b.bookingDate) - new Date(a.bookingDate));

            ordersContainer.innerHTML = orders.map(order => {
                const totalCharges = order.type === 'stitching' 
                    ? (order.items || []).reduce((sum, item) => sum + (parseFloat(item.charges) || 0), 0)
                    : (parseFloat(order.charges) || 0);
                const received = order.receivedPayment || 0;
                const balance = Math.max(0, totalCharges - received);
                const statusText = order.status || 'Pending';
                const statusClass = statusText === 'Completed' ? 'status-completed' : 'status-pending';
                const pickupDateRaw = order.type === 'stitching' ? (order.items && order.items.length > 0 ? order.items[0].pickupDate : null) : order.pickupDate;
                const pickupDate = pickupDateRaw ? new Date(pickupDateRaw + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric'}) : 'Not set';
                const description = order.type === 'stitching' 
                    ? (order.items || []).map(i => i.item).join(', ')
                    : order.description;
                const orderTypeClass = order.type === 'stitching' ? 'order-type-stitching' : 'order-type-alteration';
                
                return `
                    <div class="bg-white p-5 rounded-xl shadow-sm transition-all hover:shadow-lg relative overflow-hidden ${orderTypeClass}">
                        <button onclick='playVoiceNotification(${JSON.stringify(order)})' class="absolute top-3 right-3 p-2 rounded-full bg-indigo-50 hover:bg-indigo-100 transition-colors" aria-label="Play order status in Hindi">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                        </button>

                        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 mb-3">
                            <div>
                                <h4 class="font-extrabold text-lg text-gray-800 tracking-tight">Order #${order.orderNumber}</h4>
                                <p class="text-xs text-gray-500">Booked: ${new Date(order.bookingDate).toLocaleDateString()}</p>
                            </div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        
                        <p class="text-gray-700 my-4 text-sm">${description || 'No description'}</p>
                        
                        <div class="border-t border-gray-200 mt-4 pt-4 grid grid-cols-2 gap-4">
                            <div class="text-left sm:text-center">
                                <p class="text-xs text-gray-500 uppercase tracking-wider">Delivery Date</p>
                                <p class="font-semibold text-gray-800 mt-1">${pickupDate}</p>
                            </div>
                            <div class="text-left sm:text-center sm:border-l border-gray-200 sm:pl-4">
                                <p class="text-xs text-gray-500 uppercase tracking-wider">Balance Due</p>
                                <p class="font-bold text-xl mt-1 ${balance > 0 ? 'text-red-600' : 'text-green-600'}">₹${balance.toFixed(2)}</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderNotifications(notifications) {
            const unread = notifications.filter(n => !n.read).length;
            if(unread > 0) {
                notificationBadge.textContent = unread;
                notificationBadge.classList.remove('hidden');
            } else {
                notificationBadge.classList.add('hidden');
            }
            
            if(notifications.length > 0) {
                notificationDropdown.innerHTML = notifications.map(n => `
                    <div class="p-2 border-b last:border-b-0 ${n.read ? 'opacity-60' : ''}">
                        <p class="font-semibold text-sm">${n.title}</p>
                        <p class="text-xs text-gray-600">${n.body}</p>
                        <p class="text-right text-xs text-gray-400 mt-1">${new Date(n.timestamp).toLocaleString()}</p>
                    </div>
                `).join('');
            } else {
                notificationDropdown.innerHTML = `<p class="text-sm text-gray-500 text-center py-4">No new notifications.</p>`;
            }
        }
        
        function playVoiceNotification(order) {
            if (!('speechSynthesis' in window)) {
                alert("Sorry, your browser doesn't support voice notifications.");
                return;
            }
            
            const statusText = (order.status || 'Pending').toLowerCase() === 'completed' ? 'कंप्लीट हो गया है' : 'अभी पेंडिंग है';
            const totalCharges = order.type === 'stitching' ? (order.items || []).reduce((s, i) => s + (parseFloat(i.charges) || 0), 0) : (parseFloat(order.charges) || 0);
            const balance = Math.max(0, totalCharges - (order.receivedPayment || 0));

            let message = `नमस्ते। आपका ऑर्डर नंबर ${order.orderNumber}, ${statusText}।`;
            if (balance > 0) {
                message += ` आपकी बकाया राशि ${balance.toFixed(0)} रुपये है।`;
            } else {
                message += ` आपका कोई बकाया नहीं है।`;
            }

            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.lang = 'hi-IN';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function playTotalBalanceNotification(balance) {
            if (balance <= 0) return;
            if (!('speechSynthesis' in window)) {
                console.warn("Speech Synthesis not supported in this browser.");
                return;
            }

            const message = `आपकी टोटल बकाया राशि ${balance.toFixed(0)} रुपये है। थैंक्स फॉर यूजिंग नवरोज़ स्टिचिंग पॉइंट।`;

            setTimeout(() => {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(message);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }, 500);
        }
        
        function showDetailsView() {
            loginView.classList.add('hidden');
            detailsView.classList.remove('hidden');
        }

        function showLoginView() {
            sessionStorage.removeItem('customerMobile');
            detailsView.classList.add('hidden');
            loginView.classList.remove('hidden');
            mobileInput.value = '';
            // Detach Firebase listeners on logout
            if (ordersRef) ordersRef.off();
            if (notificationsRef) notificationsRef.off();
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const mobile = mobileInput.value;
            if (mobile.length === 10 && /^[0-9]+$/.test(mobile)) {
                sessionStorage.setItem('customerMobile', mobile);
                loginAndFetchData(mobile);
            } else {
                alert("Please enter a valid 10-digit mobile number.");
            }
        });
        
        logoutBtn.addEventListener('click', showLoginView);
        
        notificationBell.addEventListener('click', (e) => {
            e.stopPropagation();
            notificationDropdown.classList.toggle('hidden');
            const mobile = sessionStorage.getItem('customerMobile');
            if(mobile && db) {
                // Mark notifications as read in Firebase
                db.ref(`clientNotifications/${mobile}`).once('value', snapshot => {
                    snapshot.forEach(childSnapshot => {
                        if (!childSnapshot.val().read) {
                            childSnapshot.ref.update({ read: true });
                        }
                    });
                });
                notificationBadge.classList.add('hidden');
            }
        });
        
        document.addEventListener('click', (e) => {
            if (!notificationBell.contains(e.target) && !notificationDropdown.contains(e.target)) {
                notificationDropdown.classList.add('hidden');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            initializeFirebase();
            const storedMobile = sessionStorage.getItem('customerMobile');
            if (storedMobile) {
                mobileInput.value = storedMobile;
                loginAndFetchData(storedMobile);
            }
        });
    </script>


<script src="./script.js"></script></body></html>
